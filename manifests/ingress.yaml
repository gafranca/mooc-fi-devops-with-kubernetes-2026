apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-pingpong@kubernetescrd,default-strip-todo@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /pingpong
            pathType: Prefix
            backend:
              service:
                name: ping-pong-svc
                port:
                  number: 2346
          - path: /todo
            pathType: Prefix
            backend:
              service:
                name: todo-app-svc
                port:
                  number: 2345
          - path: /
            pathType: Prefix
            backend:
              service:
                name: log-output-svc
                port:
                  number: 2345